<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,200..900;1,200..900&family=Google+Sans:ital,opsz,wght@0,17..18,400..700;1,17..18,400..700&display=swap" rel="stylesheet">


    <title>Visual Novel</title>
    <link rel="stylesheet" href="styles/VNstyleSIDAPA.css">
</head>
<body>
 


    <div id="chapter-title">
            <p> Talaya </p>
            <h1> Sidapa </h1>
            <p style="margin-top:6px; font-style:italic; font-family:'Playfair Display',serif; letter-spacing:1px; font-size:14px; color:rgba(200,210,240,0.6);">"You keep people emotionally overwhelmed because silence terrifies you."</p>
            <button class="start-btn" onclick="PlayGame('Chapter1_start')">Prologue </button>
            <button class="start-btn" onclick="PlayGame('Ch1')">Chapter 1</button>
            <button class="start-btn" onclick="PlayGame('ch1_35')">Chapter 2 </button>
            <button class="start-btn" onclick="PlayGame('ch2_22')">Chapter 3 </button>
            <button class="start-btn" onclick="PlayGame('FCH_1')">Final Chapter</button>
    </div>

    <div id="vn">
        <!-- SCENE BG -->
        <div class="overflow"> 
            <div id="scene-bg"> </div>

            <!-- LOCATION DIV -->
            <div id="location-tag"></div>

            <!-- CHARACTER LAYER-->
            <div id="character-layer"></div>

            <!-- BACKGROUND MUSIC -->
            <audio id="bgm" loop></audio>

            <!-- EXIT BUTTON-->
             <button id="back-btn" onclick="goBack()"> Back </button>
             <button id="menu-btn" onclick="goToChapterScreen()">Menu</button>
             
             <a href="gettingstarted.html"><button id="return-btn"> 
               Return
             </button></a>
            <!-- DIALOG BOX -->

            <div id="choices"></div>
            
            <div id="textbox">
                <div id="speaker-name"></div>
                <div id="dialogue-text"></div>
                <div id="advance-hint">click to continue</div>
            </div>
            
            <button id="back-btn" onclick="goBack()"> Back </button>
        </div>

    </div>

        <script src="script/VNgeneralScriptSIDAPA.js"></script>
        <script src="script/ChaptersSIDAPA/SIDAPA.js"></script>
       
    </body>
 
</html>
