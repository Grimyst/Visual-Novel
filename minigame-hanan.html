<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bato-Bato-Pik — Hanan</title>
    <link rel="stylesheet" href="styles/minigame.css">
</head>
<body>
    <div class="container">
        <div class="back-button" onclick="goBack()">←</div>
        
        <div class="title" id="gameTitle">Bato-Bato-Pik</div>

        <div class="game-area">
            <div class="decorative-lines"></div>
            <div class="result-message" id="resultMessage"></div>
            
            <div class="player-side">
                <button class="choice-button rock-btn" onclick="makeChoice('rock')">
                    <img src="Assets/Rock Paper Scissors/BATHALA/REGULAR-BATHALA/Rock%20Regular.png" alt="Rock">
                </button>
                <button class="choice-button paper-btn" onclick="makeChoice('paper')">
                    <img src="Assets/Rock Paper Scissors/BATHALA/REGULAR-BATHALA/Paper%20Regular.png" alt="Paper">
                </button>
                <button class="choice-button scissors-btn" onclick="makeChoice('scissors')">
                    <img src="Assets/Rock Paper Scissors/BATHALA/REGULAR-BATHALA/Scissors%20Regular.png" alt="Scissors">
                </button>
            </div>

            <div class="vs-text">vs</div>

            <div class="computer-side">
                <div class="computer-choice empty" id="computerChoice">
                    <img id="computerImage" src="" alt="" style="display: none;">
                </div>
            </div>
        </div>

        <div class="player-names">
            <div class="player-name" id="playerName">Bathala</div>
            <div class="player-name" id="opponentName">Hanan</div>
        </div>
    </div>

    <script>
        window.minigameConfig = {
            gameTitle: 'Bathala vs Hanan',
            playerName: 'Bathala',
            opponentName: 'Hanan',
            backgroundImage: 'Assets/Background/MinigameBG/HananMinigameBG.png',
            computerChoiceImages: {
                rock: 'Assets/Rock Paper Scissors/HANAN/HANAN/Rock%20Hanan.png',
                paper: 'Assets/Rock Paper Scissors/HANAN/HANAN/Paper%20Hanan.png',
                scissors: 'Assets/Rock Paper Scissors/HANAN/HANAN/Scissors%20Hanan.png'
            }
        };
    </script>
    <script src="script/minigame.js"></script>
</body>
</html>
