<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Game</title>
    <!-- Link for CSS File-->
    <link rel="stylesheet" href="styles/minigame.css">
</head>
<body>
    <!-- Title -->
    <h1>Bato - Bato - Pik</h1>

    <!-- Player's Choices-->
    <div class = "choices">
        <button onClick = "playGame('BATO')">👊🏼</button>
        <button onClick = "playGame('PAPEL')">🖐🏼</button>
        <button onClick = "playGame('GUNTING')">✌🏼</button>
    </div>
    
    <!-- Choices Display -->
    <div class = "display">
        <div id = "playerChoiceDisplay">PLAYER: </div>
        <div id = "computerChoiceDisplay">COMPUTER: </div>
    </div>

    <!-- Result Display -->    
    <div id = "gameResult"></div>

    <!-- Link to the script file -->
    <script src = "script/minigame.js"></script>
</body>
</html>
