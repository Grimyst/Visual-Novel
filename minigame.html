<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> RPS Minigame </title>
    <link rel="stylesheet" href="styles/minigame.css">
</head>
<body>
    <div class="container">
        <div class="back-button" onclick="goBack()">←</div>
        
        <div class="title" id="gameTitle"></div>

        <div class="game-area">
            <div class="decorative-lines"></div>
            <div class="result-message" id="resultMessage"></div>
            
            <div class="player-side">
                <button class="choice-button rock-btn" onclick="makeChoice('rock')">
                    <img src="Assets/1.webp" alt="Rock">
                </button>
                <button class="choice-button paper-btn" onclick="makeChoice('paper')">
                    <img src="Assets/2.webp" alt="Paper">
                </button>
                <button class="choice-button scissors-btn" onclick="makeChoice('scissors')">
                    <img src="Assets/3.webp" alt="Scissors">
                </button>
            </div>

            <div class="vs-text">vs</div>

            <div class="computer-side">
                <div class="computer-choice empty" id="computerChoice">
                    <img id="computerImage" src="" alt="" style="display: none;">
                </div>
            </div>
        </div>

        <div class="player-names">
            <div class="player-name">Bathala</div>
            <div class="player-name">Sidapa</div>
        </div>
    </div>

    <script src="script/minigame.js"></script>
</body>
</html>
